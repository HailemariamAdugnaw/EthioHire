name: ethiohire

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-ethiohire}
      POSTGRES_USER: ${PGUSER:-ethiohire}
      POSTGRES_PASSWORD: ${PGPASSWORD:-ethiohire}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ethiohire} -d ${PGDATABASE:-ethiohire}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-ethiohire}
      PGUSER: ${PGUSER:-ethiohire}
      PGPASSWORD: ${PGPASSWORD:-ethiohire}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      AUTH_SECRET: ${AUTH_SECRET:-ethiohire-dev-secret-change-in-production}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      # Firebase (optional — see docs/FIREBASE_SETUP.md).
      # NEXT_PUBLIC_FIREBASE_* names are accepted for backward compatibility
      # with the setup guides; VITE_FIREBASE_* also works.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - backend

  signaling:
    build:
      context: ./mini-services/interview-signaling
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3031"

volumes:
  pgdata:
