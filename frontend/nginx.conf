# EthioHire frontend — SPA + API/signaling reverse proxy
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Firebase signInWithPopup requires the opener page to share its browsing
    # context group with the auth popup — without this Chrome blocks the SDK's
    # window.closed polling (COOP console warnings) and the flow can stall.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Django REST API (same-origin from the browser's point of view,
    # so relative /api paths + cookies keep working)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # base64 webcam snapshots
    }

    # Interview WebRTC signaling (socket.io, path "/")
    location /signal/ {
        proxy_pass http://signaling:3031/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback (hash routing needs only "/", but be forgiving)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
